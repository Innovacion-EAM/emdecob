name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        run: npm run lint
      
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://innovacion-eam.github.io/emdecob
      
      - name: Fix asset paths for basePath
        run: node scripts/fix-asset-paths.mjs
      
      - name: Generate SEO files (sitemap, robots)
        run: node scripts/generate-seo.mjs
      
      - name: Verify critical assets exist
        run: |
          echo "🔍 Verifying critical assets in out/..."
          
          # Videos (hero + manifiesto)
          test -f out/videos/hero.mp4 && echo "✅ hero.mp4" || { echo "❌ MISSING hero.mp4"; exit 1; }
          test -f out/videos/manifiesto.mp4 && echo "✅ manifiesto.mp4" || { echo "❌ MISSING manifiesto.mp4"; exit 1; }
          
          # Fonts (Sora + Manrope)
          test -f out/fonts/sora-latin.woff2 && echo "✅ sora-latin.woff2" || { echo "❌ MISSING sora-latin.woff2"; exit 1; }
          test -f out/fonts/sora-latin-ext.woff2 && echo "✅ sora-latin-ext.woff2" || { echo "❌ MISSING sora-latin-ext.woff2"; exit 1; }
          test -f out/fonts/manrope-latin.woff2 && echo "✅ manrope-latin.woff2" || { echo "❌ MISSING manrope-latin.woff2"; exit 1; }
          test -f out/fonts/manrope-latin-ext.woff2 && echo "✅ manrope-latin-ext.woff2" || { echo "❌ MISSING manrope-latin-ext.woff2"; exit 1; }
          
          # Key images
          test -f out/images/founders-emdecob-web.webp && echo "✅ founders-emdecob-web.webp" || { echo "❌ MISSING founders-emdecob-web.webp"; exit 1; }
          test -f out/images/cover-video-presentacion-emdecob-web.webp && echo "✅ cover-video-presentacion-emdecob-web.webp" || { echo "❌ MISSING cover-video-presentacion-emdecob-web.webp"; exit 1; }
          test -f out/images/logo.webp && echo "✅ logo.webp" || { echo "❌ MISSING logo.webp"; exit 1; }
          
          # Count totals
          VIDEO_COUNT=$(ls out/videos/*.mp4 2>/dev/null | wc -l)
          FONT_COUNT=$(ls out/fonts/*.woff2 2>/dev/null | wc -l)
          IMG_COUNT=$(ls out/images/ 2>/dev/null | wc -l)
          
          echo "📊 Total videos: $VIDEO_COUNT (expected 2)"
          echo "📊 Total fonts: $FONT_COUNT (expected 4)"
          echo "📊 Total images: $IMG_COUNT (expected 39)"
          
          [ "$VIDEO_COUNT" -eq 2 ] || { echo "❌ Video count mismatch"; exit 1; }
          [ "$FONT_COUNT" -eq 4 ] || { echo "❌ Font count mismatch"; exit 1; }
          [ "$IMG_COUNT" -eq 39 ] || { echo "❌ Image count mismatch (got $IMG_COUNT)"; exit 1; }
          
          echo "✅ All critical assets verified"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
